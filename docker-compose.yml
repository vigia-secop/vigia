services:
  postgres:
    image: postgres:16
    container_name: vigia-postgres
    environment:
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigia}
      POSTGRES_DB: vigia
    ports:
      # Solo localhost: un entorno de desarrollo no tiene por qué ser también
      # un puerto abierto en la red de quien lo corre.
      - "127.0.0.1:5432:5432"
    volumes:
      - vigia-datos:/var/lib/postgresql/data
      - ./migraciones:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia -d vigia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vigia-datos:
